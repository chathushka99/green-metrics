[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-metrics"
version = "0.2.0"
description = "PUE/WUE simulations for data centers over hourly weather series"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<4",
    "scikit-learn>=1.3,<2",
    "CoolProp>=6.6,<9",
    "openpyxl>=3.1,<4",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6.29", "matplotlib>=3.8,<4"]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
green-metrics = "green_metrics.cli:main"
