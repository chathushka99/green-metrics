[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "green-metrics"
version = "0.1.0"
description = "PUE/WUE simulations for data centers over EPW weather series"
readme = "README.md"
requires-python = ">=3.7,<3.8"
dependencies = [
    "numpy==1.18.5",
    "scipy==1.4.1",
    "pandas==1.0.5",
    "scikit-learn==0.22.2",
    "CoolProp==6.6.0",
    "joblib==0.14.1",
    "threadpoolctl==2.1.0",
    "tqdm==4.46.0",
    "openpyxl==3.0.5",
    "simplelhs==1.2.1",
    "lhsmdu==1.1",
    "pysampling==0.1.2",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
green-metrics = "green_metrics.cli:main"
